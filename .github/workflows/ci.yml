name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm@11.7.0 typecheck
      - name: Test
        run: corepack pnpm@11.7.0 test
      - name: Check dependency boundaries
        run: corepack pnpm@11.7.0 check:boundaries
      - name: Audit production dependencies
        run: corepack pnpm@11.7.0 audit --prod
      - name: Build
        run: corepack pnpm@11.7.0 build
      - name: Check initial bundle size
        run: corepack pnpm@11.7.0 check:bundle
      - name: Install Chromium
        run: corepack pnpm@11.7.0 exec playwright install --with-deps chromium
      - name: Browser E2E
        run: corepack pnpm@11.7.0 test:e2e
      - name: Office and PDF artifact validation
        run: corepack pnpm@11.7.0 verify:office

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          fi
      - if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.cloudflare.outputs.enabled == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.cloudflare.outputs.enabled == 'true'
        name: Install dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - if: steps.cloudflare.outputs.enabled == 'true'
        name: Build
        run: corepack pnpm@11.7.0 build
      - if: steps.cloudflare.outputs.enabled == 'true'
        name: Deploy branch to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=browser-agent-wzp100-app --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
